<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Animation abstraite des repères KEO : écouter, vérifier, synthétiser. Trois anneaux colorés tournent autour d’un centre lumineux."><title>Écouter, vérifier, synthétiser</title><desc>Animation abstraite de trois anneaux entrelac��s autour d’un centre lumineux.</desc><style>.ring{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:turn 18s linear infinite}.r1{stroke:#9fe2c9}.r2{stroke:#e4b979;animation-direction:reverse;animation-duration:23s}.r3{stroke:#94aec8;animation-duration:28s}.pulse{animation:pulse 3.8s ease-in-out infinite;transform-origin:480px 270px}.spark{animation:glow 2.8s ease-in-out infinite alternate}text{font-family:Arial,sans-serif;fill:#f4f3ef;letter-spacing:5px}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.13);opacity:.62}}@keyframes glow{to{opacity:.25}}@media(prefers-reduced-motion:reduce){.ring,.pulse,.spark{animation:none!important}}</style><rect width="960" height="540" rx="24" fill="#101a2d"/><circle cx="480" cy="270" r="155" fill="#9fe2c9" opacity=".08"/><g class="ring r1"><ellipse cx="480" cy="270" rx="250" ry="112"/></g><g class="ring r2"><ellipse cx="480" cy="270" rx="250" ry="112" transform="rotate(58 480 270)"/></g><g class="ring r3"><ellipse cx="480" cy="270" rx="250" ry="112" transform="rotate(-58 480 270)"/></g><circle class="pulse" cx="480" cy="270" r="40" fill="#9fe2c9" opacity=".16"/><circle cx="480" cy="270" r="8" fill="#e4b979"/><circle class="spark" cx="278" cy="145" r="5" fill="#f4f3ef"/><circle class="spark" cx="682" cy="145" r="5" fill="#f4f3ef"/><text x="480" y="485" text-anchor="middle" font-size="13">ÉCOUTER · VÉRIFIER · SYNTHÉTISER</text></svg>
